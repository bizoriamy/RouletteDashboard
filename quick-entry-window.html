<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quick Roulette Entry - v2026.08.14.1</title>
    <link rel="icon" href="live-dashboard-icon.ico" sizes="any" />
    <link rel="stylesheet" href="quick-entry-window.css?v=2026.08.14.1" />
  </head>
  <body>
    <main>
      <header>
        <div><small>LIVE COMPANION</small><h1>Quick Roulette Entry</h1></div>
        <div class="header-options">
          <label class="layout-choice">Layout
            <select id="quick-layout" aria-label="Roulette zero position">
              <option value="left">0 Left</option>
              <option value="top">0 Top (vertical)</option>
            </select>
          </label>
          <label><input id="quick-topmost" type="checkbox" /> Always on top</label>
        </div>
      </header>
      <section id="quick-history" class="history" aria-label="Latest ten winning numbers"></section>
      <div class="controls">
        <input id="quick-input" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="0-36" autofocus />
        <button id="quick-enter" class="primary" type="button">Enter</button>
        <button id="quick-undo" type="button">Undo</button>
        <span id="quick-status">Connected to main dashboard</span>
      </div>
      <section id="quick-grid" class="grid layout-left" aria-label="European roulette number layout"></section>
      <footer><span>Spin processing remains in the main dashboard.</span><strong>v2026.08.14.1</strong></footer>
    </main>
    <script src="quick-entry-window.js?v=2026.08.14.1"></script>
  </body>
</html>
