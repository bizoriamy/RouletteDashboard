<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BetPilot Strategy Studio</title>
  <link rel="stylesheet" href="studio.css">
</head>
<body>
  <header class="studio-header">
    <h1>BetPilot Strategy Studio</h1>
  </header>

  <main class="studio-main">
    <!-- ===== 预设策略区域 ===== -->
    <section class="presets-section">
      <div class="presets-header">
        <h2>Strategy Presets</h2>
        <span class="presets-hint">Click a preset to load it instantly</span>
      </div>
      <div id="presets-list" class="presets-list"></div>
    </section>

    <!-- ===== 测试模式区域 ===== -->
    <section class="test-section">
      <div class="test-header">
        <h2>Test Mode</h2>
        <button class="btn btn-export" onclick="importFromMain()">Import From Main</button>
      </div>
      <div class="test-controls">
        <textarea id="test-input" class="test-input" placeholder="Enter spin history, comma separated. Example: 5, 12, 3, 7, 19, 0, 14"></textarea>
        <button class="btn btn-run-test" onclick="runTest()">Run Test</button>
      </div>
      <div id="test-results" class="test-results"></div>
    </section>

    <!-- ===== 模拟器区域 ===== -->
    <section class="simulator-section">
      <div class="simulator-header">
        <h2>Simulator</h2>
        <button class="btn btn-run-sim" onclick="runSimulation()">Run Simulation</button>
      </div>
      <div class="simulator-controls">
        <label class="sim-input-label" for="sim-history-size">Use last</label>
        <input type="number" id="sim-history-size" class="form-input sim-history-size" min="10" value="100" step="10">
        <span class="sim-input-suffix">spins of imported history</span>
        <button class="btn btn-run-sim-lg" onclick="runSimulation()">▶ Run Backtest</button>
      </div>
      <div id="sim-results" class="sim-results"></div>
    </section>

    <!-- 空白的策略列表区域 -->
    <section id="strategy-list" class="strategy-list">
      <p class="empty-message">No strategies yet. Create your first one!</p>
    </section>

    <!-- New Strategy 按钮 -->
    <button id="new-strategy-btn" class="new-strategy-btn" onclick="createNewStrategy()">New Strategy</button>
  </main>

  <!-- ===== 策略编辑器模态框 ===== -->
  <div id="editor-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="editor-title">Edit Strategy</h2>
        <button class="modal-close-btn" onclick="closeEditor()">&times;</button>
      </div>

      <div class="modal-body">
        <!-- 基本信息 -->
        <div class="form-section">
          <h3>General</h3>
          <div class="form-row">
            <label for="edit-name">Name</label>
            <input type="text" id="edit-name" class="form-input">
          </div>
          <div class="form-row">
            <label for="edit-enabled">Enabled</label>
            <select id="edit-enabled" class="form-input">
              <option value="true">Enabled</option>
              <option value="false">Disabled</option>
            </select>
          </div>
          <div class="form-row">
            <label for="edit-priority">Priority</label>
            <input type="number" id="edit-priority" class="form-input" min="1" value="1">
          </div>
        </div>

        <!-- 条件 -->
        <div class="form-section">
          <h3>Conditions</h3>
          <div class="form-row">
            <label for="edit-logic">Logic</label>
            <select id="edit-logic" class="form-input">
              <option value="AND">AND (all must match)</option>
              <option value="OR">OR (any can match)</option>
            </select>
          </div>
          <div class="form-row" id="rules-container">
            <!-- 规则列表将由 JS 动态渲染 -->
            <div class="rule-list" id="rule-list"></div>
            <button type="button" class="btn btn-add-rule" onclick="addRuleField()">+ Add Rule</button>
          </div>
        </div>

        <!-- 行动 -->
        <div class="form-section">
          <h3>Action</h3>
          <div class="form-row">
            <label for="edit-target">Target</label>
            <select id="edit-target" class="form-input">
              <option value="red">Red</option>
              <option value="black">Black</option>
              <option value="odd">Odd</option>
              <option value="even">Even</option>
              <option value="1-18">1-18</option>
              <option value="19-36">19-36</option>
            </select>
          </div>
          <div class="form-row">
            <label for="edit-stake-type">Stake Type</label>
            <select id="edit-stake-type" class="form-input">
              <option value="fixed">Fixed</option>
              <option value="dynamic">Dynamic</option>
            </select>
          </div>
          <div class="form-row">
            <label for="edit-stake-value">Stake Value (RM)</label>
            <input type="number" id="edit-stake-value" class="form-input" min="0" step="0.5" value="10">
          </div>
        </div>

        <!-- 风险控制 -->
        <div class="form-section">
          <h3>Risk Control</h3>
          <div class="form-row">
            <label for="edit-max-stake">Max Stake (RM)</label>
            <input type="number" id="edit-max-stake" class="form-input" min="0" step="0.5" value="200">
          </div>
          <div class="form-row">
            <label for="edit-stop-loss">Stop Loss (RM)</label>
            <input type="number" id="edit-stop-loss" class="form-input" min="0" step="0.5" value="500">
          </div>
          <div class="form-row">
            <label for="edit-stop-win">Stop Win (RM)</label>
            <input type="number" id="edit-stop-win" class="form-input" min="0" step="0.5" value="300">
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-cancel" onclick="closeEditor()">Cancel</button>
        <button class="btn btn-save" onclick="saveEditor()">Save</button>
      </div>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="engine.js"></script>
  <script src="simulator.js"></script>
  <script src="presets.js"></script>
  <script src="studio.js"></script>
</body>
</html>
