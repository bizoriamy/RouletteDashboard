<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BetPilot · Roulette Selector</title>
    <style>
        /* ─── 全局重置 ─── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --felt: #1a3a2a;
            --felt-dark: #0f2419;
            --gold: #d4a843;
            --gold-light: #f0d080;
            --gold-glow: rgba(212, 168, 67, 0.45);
            --red: #c0392b;
            --red-bright: #e74c3c;
            --black: #1a1a1a;
            --green: #2d7d46;
            --white: #f5f0e6;
            --muted: #8a8a7a;
            --border-light: rgba(255, 255, 255, 0.08);
            --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.7);
            --radius: 12px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 50% -20%, rgba(212, 168, 67, 0.06), transparent 50%),
                #0d1a12;
            font-family: var(--font);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ─── 主浮动容器 ─── */
        .roulette-float {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            width: 580px;
            max-height: 90vh;
            overflow-y: auto;
            background: var(--felt-dark);
            border: 1px solid rgba(212, 168, 67, 0.25);
            border-radius: var(--radius);
            box-shadow: var(--shadow-heavy), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            font-size: 13px;
            user-select: none;
            backdrop-filter: blur(4px);
            transition: box-shadow 0.2s;
        }

        /* 自定义滚动条 */
        .roulette-float::-webkit-scrollbar {
            width: 4px;
        }
        .roulette-float::-webkit-scrollbar-track {
            background: transparent;
        }
        .roulette-float::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 10px;
        }

        /* ─── 标题栏 ─── */
        .titlebar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(212, 168, 67, 0.15);
            border-radius: var(--radius) var(--radius) 0 0;
            cursor: grab;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(6px);
        }
        .titlebar:active {
            cursor: grabbing;
        }

        .titlebar .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
            color: var(--white);
        }
        .titlebar .brand .dot {
            color: var(--gold);
            font-size: 14px;
        }
        .titlebar .brand small {
            font-weight: 400;
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .titlebar .actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .titlebar .actions .counter {
            font-size: 11px;
            font-weight: 600;
            color: var(--gold);
            background: rgba(212, 168, 67, 0.1);
            padding: 2px 12px;
            border-radius: 12px;
            border: 1px solid rgba(212, 168, 67, 0.2);
        }
        .titlebar .actions .btn-clear {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--muted);
            padding: 3px 12px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.3px;
        }
        .titlebar .actions .btn-clear:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--white);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* ─── 主体 ─── */
        .body {
            padding: 12px 14px 14px;
        }

        /* ─── 布局标签 ─── */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            padding: 3px;
        }
        .tabs .tab {
            flex: 1;
            padding: 6px 0;
            text-align: center;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: var(--muted);
            background: transparent;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tabs .tab:hover {
            color: var(--white);
            background: rgba(255, 255, 255, 0.05);
        }
        .tabs .tab.active {
            color: #1a1a1a;
            background: var(--gold);
            box-shadow: 0 2px 8px rgba(212, 168, 67, 0.3);
        }

        /* ─── 面板容器 ─── */
        .panel {
            display: none;
        }
        .panel.active {
            display: block;
        }

        /* ─── 标准赌桌 ─── */
        .table-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(48px, 1fr));
            gap: 2px;
            background: var(--felt);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
        }
        .table-grid .cell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3px 2px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.15s, filter 0.15s;
            border: 1px solid rgba(255, 255, 255, 0.06);
            min-height: 30px;
            background: var(--black);
            color: var(--white);
        }
        .table-grid .cell.red {
            background: var(--red);
        }
        .table-grid .cell.black {
            background: var(--black);
            border-color: rgba(255, 255, 255, 0.08);
        }
        .table-grid .cell.green {
            background: var(--green);
        }
        .table-grid .cell.zero {
            grid-column: 1 / 4;
            font-size: 14px;
            padding: 4px 2px;
            border-radius: 4px;
        }

        .table-grid .cell:hover {
            transform: scale(1.04);
            z-index: 2;
            box-shadow: 0 0 0 2px var(--gold), 0 4px 14px rgba(0, 0, 0, 0.4);
            filter: brightness(1.12);
        }

        .table-grid .cell.locked {
            box-shadow: 0 0 0 2px var(--gold), 0 0 20px var(--gold-glow);
            transform: scale(1.04);
            z-index: 2;
            filter: brightness(1.15);
        }
        .table-grid .cell.locked::after {
            content: '◆';
            position: absolute;
            top: -2px;
            right: 3px;
            font-size: 8px;
            color: var(--gold);
        }

        .table-grid .cell.highlight {
            box-shadow: 0 0 0 2px var(--gold-light);
            filter: brightness(1.1);
            z-index: 1;
        }

        /* ─── 外围投注行 ─── */
        .outside-row {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            margin-top: 8px;
        }
        .outside-row .outside-btn {
            padding: 3px 0;
            font-size: 8px;
            font-weight: 700;
            text-align: center;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: var(--muted);
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .outside-row .outside-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--white);
            border-color: rgba(255, 255, 255, 0.12);
        }
        .outside-row .outside-btn.active {
            background: var(--gold);
            color: #1a1a1a;
            border-color: var(--gold);
            box-shadow: 0 2px 12px rgba(212, 168, 67, 0.25);
        }
        .outside-row .outside-btn.active-red {
            background: var(--red-bright);
            color: #fff;
            border-color: var(--red-bright);
            box-shadow: 0 2px 12px rgba(192, 57, 43, 0.3);
        }
        .outside-row .outside-btn.active-black {
            background: #2a2a2a;
            color: #fff;
            border-color: #444;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        /* ─── Dozen + Column 行 ─── */
        .extra-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-top: 6px;
        }
        .extra-row .extra-btn {
            padding: 2px 0;
            font-size: 7px;
            font-weight: 700;
            text-align: center;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: var(--muted);
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .extra-row .extra-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--white);
            border-color: rgba(255, 255, 255, 0.12);
        }
        .extra-row .extra-btn.active {
            background: var(--gold);
            color: #1a1a1a;
            border-color: var(--gold);
            box-shadow: 0 2px 12px rgba(212, 168, 67, 0.2);
        }

        /* ─── 轮盘视图 ─── */
        .wheel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .wheel-ring {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 6px solid #8a6e3a;
            background: radial-gradient(circle at 50% 45%, #1a3a2a 0%, #0f2419 100%);
            box-shadow: inset 0 0 0 2px #b8954a, 0 8px 30px rgba(0, 0, 0, 0.5);
            margin: 4px auto;
            flex-shrink: 0;
        }
        .wheel-ring .pocket {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 22px;
            height: 30px;
            margin: -15px 0 0 -11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: 800;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            cursor: pointer;
            transition: filter 0.12s, box-shadow 0.12s, transform 0.12s;
            transform: rotate(var(--a)) translateY(-96px) rotate(calc(-1 * var(--a)));
        }
        .wheel-ring .pocket.red {
            background: var(--red);
        }
        .wheel-ring .pocket.black {
            background: var(--black);
            border-color: rgba(255, 255, 255, 0.08);
        }
        .wheel-ring .pocket.green {
            background: var(--green);
        }
        .wheel-ring .pocket:hover {
            transform: rotate(var(--a)) translateY(-96px) rotate(calc(-1 * var(--a))) scale(1.12);
            z-index: 3;
            box-shadow: 0 0 0 2px var(--gold), 0 0 18px var(--gold-glow);
            filter: brightness(1.2);
        }
        .wheel-ring .pocket.locked {
            box-shadow: 0 0 0 2px var(--gold), 0 0 22px var(--gold-glow);
            transform: rotate(var(--a)) translateY(-96px) rotate(calc(-1 * var(--a))) scale(1.08);
            z-index: 3;
            filter: brightness(1.15);
        }
        .wheel-ring .pocket.highlight {
            box-shadow: 0 0 0 2px var(--gold-light);
            filter: brightness(1.08);
            z-index: 1;
        }
        .wheel-ring .center {
            position: absolute;
            inset: 32%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: radial-gradient(circle, #1a3a2a, #0f2419);
            border: 1px solid rgba(212, 168, 67, 0.2);
            font-size: 8px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            pointer-events: none;
        }
        .wheel-ring .center span {
            font-size: 14px;
            font-family: Georgia, serif;
        }

        /* ─── 摘要栏 ─── */
        .summary-bar {
            margin-top: 10px;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            min-height: 32px;
            font-size: 11px;
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
        }
        .summary-bar .chip {
            display: inline-block;
            background: var(--gold);
            color: #1a1a1a;
            padding: 0 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
        }
        .summary-bar .chip-number {
            display: inline-block;
            background: var(--green);
            color: #fff;
            padding: 0 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
        }
        .summary-bar.empty::after {
            content: 'Click numbers or bets to build your selection';
            color: var(--muted);
            opacity: 0.5;
        }

        /* ─── 底部提示 ─── */
        .hint {
            margin-top: 6px;
            text-align: center;
            font-size: 9px;
            color: var(--muted);
            opacity: 0.4;
            letter-spacing: 0.3px;
        }

        /* ─── 响应式 ─── */
        @media (max-width: 680px) {
            .roulette-float {
                width: 96vw;
                top: 10px;
                left: 2vw;
                transform: none;
                max-height: 94vh;
            }
            .table-grid .cell {
                font-size: 11px;
                min-height: 28px;
                padding: 4px 0;
            }
            .wheel-ring {
                width: 170px;
                height: 170px;
            }
            .wheel-ring .pocket {
                width: 18px;
                height: 24px;
                margin: -12px 0 0 -9px;
                font-size: 7px;
                transform: rotate(var(--a)) translateY(-74px) rotate(calc(-1 * var(--a)));
            }
            .wheel-ring .pocket:hover {
                transform: rotate(var(--a)) translateY(-74px) rotate(calc(-1 * var(--a))) scale(1.1);
            }
            .wheel-ring .pocket.locked {
                transform: rotate(var(--a)) translateY(-74px) rotate(calc(-1 * var(--a))) scale(1.06);
            }
            .outside-row .outside-btn {
                font-size: 8px;
                padding: 4px 0;
            }
            .extra-row .extra-btn {
                font-size: 8px;
                padding: 3px 0;
            }
            .titlebar .brand {
                font-size: 10px;
            }
            .titlebar .actions .counter {
                font-size: 9px;
                padding: 1px 8px;
            }
        }
    </style>
</head>
<body>

    <!-- ─── 主浮动容器 ─── -->
    <div class="roulette-float" id="floatContainer">

        <!-- 标题栏（拖拽区） -->
        <div class="titlebar" id="titlebar">
            <div class="brand">
                <span class="dot">◆</span> BETPILOT
                <small>· selector</small>
            </div>
            <div class="actions">
                <span class="counter" id="counter">0</span>
                <button class="btn-clear" id="clearBtn">✕ clear</button>
            </div>
        </div>

        <!-- 主体 -->
        <div class="body">

            <!-- 标签 -->
            <div class="tabs" id="tabs">
                <button class="tab active" data-panel="table">Table</button>
                <button class="tab" data-panel="wheel">Wheel</button>
            </div>

            <!-- 面板：标准赌桌 -->
            <div class="panel active" id="panel-table">
                <div class="table-grid" id="tableGrid"></div>

                <!-- 外围投注 -->
                <div class="outside-row" id="outsideRow">
                    <button class="outside-btn" data-bet="red">🔴 Red</button>
                    <button class="outside-btn" data-bet="black">⚫ Black</button>
                    <button class="outside-btn" data-bet="odd">Odd</button>
                    <button class="outside-btn" data-bet="even">Even</button>
                    <button class="outside-btn" data-bet="low">1–18</button>
                    <button class="outside-btn" data-bet="high">19–36</button>
                </div>

                <!-- Dozen + Column -->
                <div class="extra-row" id="extraRow">
                    <button class="extra-btn" data-bet="dozen1">1st 12</button>
                    <button class="extra-btn" data-bet="dozen2">2nd 12</button>
                    <button class="extra-btn" data-bet="dozen3">3rd 12</button>
                    <button class="extra-btn" data-bet="col1">Col 1</button>
                    <button class="extra-btn" data-bet="col2">Col 2</button>
                    <button class="extra-btn" data-bet="col3">Col 3</button>
                </div>
            </div>

            <!-- 面板：轮盘 -->
            <div class="panel" id="panel-wheel">
                <div class="wheel-container">
                    <div class="wheel-ring" id="wheelRing">
                        <div class="center"><span>0</span> european</div>
                    </div>
                </div>
            </div>

            <!-- 摘要 -->
            <div class="summary-bar empty" id="summaryBar"></div>

            <!-- 提示 -->
            <div class="hint">drag title to move · hover to preview · click to lock · esc to clear</div>

        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── 数据 ───
            const RED = new Set([1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36]);
            const NUMBERS = Array.from({ length: 37 }, (_, n) => n);

            const WHEEL_ORDER = [
                0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10,
                5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26
            ];

            function colorOf(n) {
                if (n === 0) return 'green';
                return RED.has(n) ? 'red' : 'black';
            }

            function dozenOf(n) {
                if (n === 0) return null;
                return Math.ceil(n / 12);
            }

            function columnOf(n) {
                if (n === 0) return null;
                return ((n - 1) % 3) + 1;
            }

            // ─── 投注映射 ───
            const BET_MAP = {
                red: { label: 'Red', numbers: NUMBERS.filter(n => n !== 0 && RED.has(n)) },
                black: { label: 'Black', numbers: NUMBERS.filter(n => n !== 0 && !RED.has(n)) },
                odd: { label: 'Odd', numbers: NUMBERS.filter(n => n !== 0 && n % 2 === 1) },
                even: { label: 'Even', numbers: NUMBERS.filter(n => n !== 0 && n % 2 === 0) },
                low: { label: '1–18', numbers: NUMBERS.filter(n => n >= 1 && n <= 18) },
                high: { label: '19–36', numbers: NUMBERS.filter(n => n >= 19 && n <= 36) },
                dozen1: { label: '1st 12', numbers: NUMBERS.filter(n => n >= 1 && n <= 12) },
                dozen2: { label: '2nd 12', numbers: NUMBERS.filter(n => n >= 13 && n <= 24) },
                dozen3: { label: '3rd 12', numbers: NUMBERS.filter(n => n >= 25 && n <= 36) },
                col1: { label: 'Col 1', numbers: NUMBERS.filter(n => n !== 0 && columnOf(n) === 1) },
                col2: { label: 'Col 2', numbers: NUMBERS.filter(n => n !== 0 && columnOf(n) === 2) },
                col3: { label: 'Col 3', numbers: NUMBERS.filter(n => n !== 0 && columnOf(n) === 3) },
            };

            // ─── DOM refs ───
            const container = document.getElementById('floatContainer');
            const titlebar = document.getElementById('titlebar');
            const tableGrid = document.getElementById('tableGrid');
            const wheelRing = document.getElementById('wheelRing');
            const summaryBar = document.getElementById('summaryBar');
            const counter = document.getElementById('counter');
            const clearBtn = document.getElementById('clearBtn');

            // ─── 状态 ───
            let locked = new Set(); // 锁定的号码
            let activeBets = new Set(); // 活跃的投注键
            let hovered = null; // 临时高亮

            // ─── 渲染：标准赌桌 ───
            function renderTable() {
                tableGrid.innerHTML = '';
                // 0 放在第一行
                const zero = document.createElement('div');
                zero.className = 'cell green zero';
                zero.dataset.n = '0';
                zero.textContent = '0';
                tableGrid.appendChild(zero);

                // 1-36
                for (let n = 1; n <= 36; n++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${colorOf(n)}`;
                    cell.dataset.n = String(n);
                    cell.textContent = String(n);
                    tableGrid.appendChild(cell);
                }
                // 绑定事件
                tableGrid.querySelectorAll('.cell').forEach(el => {
                    const n = parseInt(el.dataset.n);
                    el.addEventListener('mouseenter', () => { highlight(n); });
                    el.addEventListener('mouseleave', () => { unhighlight(); });
                    el.addEventListener('click', () => { toggleLock(n); });
                });
                updateUI();
            }

            // ─── 渲染：轮盘 ───
            function renderWheel() {
                wheelRing.innerHTML = '';
                const center = document.createElement('div');
                center.className = 'center';
                center.innerHTML = '<span>0</span> european';
                wheelRing.appendChild(center);

                const total = WHEEL_ORDER.length;
                WHEEL_ORDER.forEach((n, i) => {
                    const angle = (i / total) * 360;
                    const pocket = document.createElement('div');
                    pocket.className = `pocket ${colorOf(n)}`;
                    pocket.dataset.n = String(n);
                    pocket.textContent = String(n);
                    pocket.style.setProperty('--a', angle + 'deg');
                    pocket.addEventListener('mouseenter', () => { highlight(n); });
                    pocket.addEventListener('mouseleave', () => { unhighlight(); });
                    pocket.addEventListener('click', () => { toggleLock(n); });
                    wheelRing.appendChild(pocket);
                });
                updateUI();
            }

            // ─── 高亮逻辑 ───
            function getCovered() {
                const covered = new Set();
                if (locked.size) {
                    locked.forEach(n => covered.add(n));
                }
                activeBets.forEach(key => {
                    const bet = BET_MAP[key];
                    if (bet) bet.numbers.forEach(n => covered.add(n));
                });
                return covered;
            }

            function highlight(n) {
                hovered = n;
                updateUI();
            }

            function unhighlight() {
                hovered = null;
                updateUI();
            }

            function toggleLock(n) {
                if (locked.has(n)) {
                    locked.delete(n);
                } else {
                    locked.add(n);
                }
                // 如果点击的是号码，清除激活的投注（用户意图是选号码而非投注）
                // 但保留已锁定的号码
                updateUI();
            }

            function toggleBet(key) {
                if (activeBets.has(key)) {
                    activeBets.delete(key);
                } else {
                    activeBets.add(key);
                }
                // 如果激活投注，不清除锁定的号码（允许组合）
                updateUI();
            }

            function clearAll() {
                locked.clear();
                activeBets.clear();
                hovered = null;
                updateUI();
            }

            // ─── UI 更新 ───
            function updateUI() {
                const covered = getCovered();

                // 更新所有单元格
                document.querySelectorAll('.cell, .pocket').forEach(el => {
                    const n = parseInt(el.dataset.n);
                    if (isNaN(n)) return;
                    el.classList.remove('locked', 'highlight');
                    if (locked.has(n)) {
                        el.classList.add('locked');
                    } else if (covered.has(n) && !locked.has(n)) {
                        el.classList.add('highlight');
                    }
                    // hover 覆盖
                    if (hovered !== null && n === hovered && !locked.has(n)) {
                        el.classList.add('highlight');
                    }
                });

                // 更新外围投注按钮
                document.querySelectorAll('.outside-btn, .extra-btn').forEach(el => {
                    const key = el.dataset.bet;
                    el.classList.remove('active', 'active-red', 'active-black');
                    if (activeBets.has(key)) {
                        el.classList.add('active');
                        if (key === 'red') el.classList.add('active-red');
                        if (key === 'black') el.classList.add('active-black');
                    }
                });

                // 更新摘要
                const total = locked.size + activeBets.size;
                counter.textContent = total;

                const parts = [];
                if (locked.size) {
                    const sorted = Array.from(locked).sort((a, b) => a - b);
                    parts.push(`<span class="chip-number">${sorted.join(' ')}</span>`);
                }
                activeBets.forEach(key => {
                    const bet = BET_MAP[key];
                    if (bet) parts.push(`<span class="chip">${bet.label}</span>`);
                });

                if (parts.length) {
                    summaryBar.innerHTML = parts.join(' ');
                    summaryBar.classList.remove('empty');
                } else {
                    summaryBar.innerHTML = '';
                    summaryBar.classList.add('empty');
                }
            }

            // ─── 绑定投注按钮 ───
            function bindBets() {
                document.querySelectorAll('.outside-btn, .extra-btn').forEach(el => {
                    el.addEventListener('click', () => {
                        toggleBet(el.dataset.bet);
                    });
                });
            }

            // ─── 标签切换 ───
            function bindTabs() {
                document.querySelectorAll('.tab').forEach(tab => {
                    tab.addEventListener('click', () => {
                        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                        tab.classList.add('active');
                        document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
                    });
                });
            }

            // ─── 拖拽 ───
            function initDrag() {
                let dragging = false;
                let startX, startY, origX, origY;

                titlebar.addEventListener('mousedown', (e) => {
                    if (e.target.closest('.actions')) return;
                    dragging = true;
                    const rect = container.getBoundingClientRect();
                    startX = e.clientX;
                    startY = e.clientY;
                    origX = rect.left;
                    origY = rect.top;
                    container.style.left = origX + 'px';
                    container.style.top = origY + 'px';
                    container.style.transform = 'none';
                    container.style.transition = 'none';
                    e.preventDefault();
                });

                document.addEventListener('mousemove', (e) => {
                    if (!dragging) return;
                    container.style.left = (origX + (e.clientX - startX)) + 'px';
                    container.style.top = (origY + (e.clientY - startY)) + 'px';
                });

                document.addEventListener('mouseup', () => {
                    if (dragging) {
                        dragging = false;
                        container.style.transition = '';
                    }
                });
            }

            // ─── 键盘 ───
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') clearAll();
            });

            // ─── 初始化 ───
            renderTable();
            renderWheel();
            bindBets();
            bindTabs();
            initDrag();
            clearBtn.addEventListener('click', clearAll);
            updateUI();

            // ─── 暴露到全局（调试） ───
            window.__selector = { locked, activeBets, clearAll, toggleLock, toggleBet };

        })();
    </script>

</body>
</html>
