<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roulette Capture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0a1a;
      color: #ddd;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      width: 100%;
    }
    h1 {
      text-align: center;
      font-size: 20px;
      color: #e63946;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .sub {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-bottom: 20px;
    }

    /* Input card */
    .input-card {
      background: #111128;
      border: 1px solid #2d2d5e;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 12px;
    }

    .input-card .label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-align: center;
    }

    .big-input-wrap {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .big-input {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: 2px solid #3a3a6e;
      background: #0d1b2a;
      color: #fff;
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .big-input:focus { border-color: #e63946; }
    .big-input::placeholder { color: #333; font-weight: 400; font-size: 16px; }

    .send-btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: #e63946;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.15s;
    }
    .send-btn:hover { background: #c1121f; }
    .send-btn:disabled { background: #442; color: #666; cursor: not-allowed; }

    /* Quick number pad */
    .pad-section { margin-bottom: 12px; }
    .pad-label {
      font-size: 10px;
      color: #555;
      margin-bottom: 4px;
      text-align: center;
    }
    .pad {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
    }
    .pad button {
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #2d2d5e;
      background: transparent;
      color: #777;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.1s;
    }
    .pad button:hover { background: #1a1a3e; color: #ddd; }

    /* Status */
    .status {
      text-align: center;
      font-size: 13px;
      margin-top: 8px;
      min-height: 20px;
    }
    .status.ok { color: #2d6a4f; }
    .status.err { color: #e63946; }

    /* Recent captures */
    .recent-card {
      background: #111128;
      border: 1px solid #2d2d5e;
      border-radius: 12px;
      padding: 16px;
    }
    .recent-card h2 {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .recent-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 30px;
    }
    .recent-chip {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      color: #fff;
    }
    .recent-chip.red { background: #e63946; }
    .recent-chip.black { background: #222; border: 1px solid #444; }
    .recent-chip.green { background: #2d6a4f; }
    .recent-empty { color: #444; font-size: 12px; font-style: italic; align-self: center; }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #555;
      margin-top: 8px;
    }
    .clear-btn {
      background: none;
      border: none;
      color: #555;
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
    }
    .clear-btn:hover { color: #e63946; }

    /* keyboard shortcut hint */
    .hint {
      text-align: center;
      font-size: 10px;
      color: #444;
      margin-top: 6px;
    }

    @media (max-width: 450px) {
      body { padding: 12px; }
      .big-input { font-size: 24px; padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎰 Roulette Capture</h1>
    <p class="sub">Keep this tab open next to the casino. Type numbers as they appear.</p>

    <!-- Input -->
    <div class="input-card">
      <div class="label">Winning Number</div>
      <div class="big-input-wrap">
        <input id="num-input" class="big-input" type="number" min="0" max="36" placeholder="0–36" autofocus />
      </div>
      <button id="send-btn" class="send-btn">⬆ Send to Dashboard</button>
      <div id="status" class="status"></div>
    </div>

    <!-- Quick pad -->
    <div class="pad-section">
      <div class="pad-label">Quick pick</div>
      <div class="pad" id="number-pad"></div>
    </div>

    <!-- Recent captures -->
    <div class="recent-card">
      <h2>Recent Captures</h2>
      <div class="recent-list" id="recent-list">
        <span class="recent-empty">No captures yet</span>
      </div>
      <div class="status-bar">
        <span id="capture-count">0 total</span>
        <button id="clear-btn" class="clear-btn">Clear all</button>
      </div>
    </div>

    <div class="hint">Press Enter to send · F5 to test</div>
  </div>

  <script>
    const RED = new Set([1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36]);
    const QUICK = [0, 1, 2, 3, 4, 5, 7, 8, 10, 11, 14, 17, 19, 20, 23, 25, 28, 29, 32, 34, 36];

    const input = document.getElementById('num-input');
    const sendBtn = document.getElementById('send-btn');
    const statusEl = document.getElementById('status');
    const recentList = document.getElementById('recent-list');
    const countEl = document.getElementById('capture-count');

    function color(n) {
      if (n === 0) return 'green';
      return RED.has(n) ? 'red' : 'black';
    }

    // Quick pad
    const pad = document.getElementById('number-pad');
    for (const n of QUICK) {
      const btn = document.createElement('button');
      btn.textContent = n;
      btn.addEventListener('click', () => { input.value = n; input.focus(); input.dispatchEvent(new Event('input')); });
      pad.appendChild(btn);
    }

    // Send
    async function send() {
      const raw = input.value.trim();
      if (!raw) { statusEl.textContent = 'Type a number 0–36'; statusEl.className = 'status err'; return; }
      const n = parseInt(raw, 10);
      if (isNaN(n) || n < 0 || n > 36) { statusEl.textContent = 'Invalid: must be 0–36'; statusEl.className = 'status err'; return; }

      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending...';
      try {
        const r = await fetch('/api/spin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ number: n, method: 'capture-tab' }),
        });
        const d = await r.json();
        if (d.ok) {
          statusEl.textContent = '✓ Sent ' + n;
          statusEl.className = 'status ok';
          input.value = '';
          input.focus();
          loadRecent();
        } else {
          statusEl.textContent = '✗ ' + (d.error || 'Unknown error');
          statusEl.className = 'status err';
        }
      } catch (e) {
        statusEl.textContent = '✗ Server unreachable. Is capture-server.py running?';
        statusEl.className = 'status err';
      }
      sendBtn.disabled = false;
      sendBtn.textContent = '⬆ Send to Dashboard';
      setTimeout(() => { if (!statusEl.textContent.startsWith('✗')) { statusEl.textContent = ''; statusEl.className = 'status'; } }, 2500);
    }

    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
    sendBtn.addEventListener('click', send);

    // Recent captures
    async function loadRecent() {
      try {
        const r = await fetch('/api/spins');
        const spins = await r.json();
        countEl.textContent = spins.length + ' total';
        if (spins.length === 0) {
          recentList.innerHTML = '<span class="recent-empty">No captures yet</span>';
          return;
        }
        const last = spins.slice(-20).reverse();
        recentList.innerHTML = last.map(s =>
          `<div class="recent-chip ${color(s.number)}" title="${s.capturedAt}">${s.number}</div>`
        ).join('');
      } catch { /* server not running */ }
    }

    document.getElementById('clear-btn').addEventListener('click', async () => {
      if (!confirm('Clear all captured spins?')) return;
      try {
        await fetch('/api/spins', { method: 'DELETE' });
        loadRecent();
      } catch {}
    });

    // Auto-refresh
    loadRecent();
    setInterval(loadRecent, 3000);
    // Focus input immediately
    setTimeout(() => input.focus(), 50);
  </script>
</body>
</html>
